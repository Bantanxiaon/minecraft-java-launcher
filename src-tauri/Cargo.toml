[package]
name = "app"
version = "0.8.1"
description = "SH启动器 - Windows Minecraft Java Edition instance and content launcher"
authors = ["SH启动器 contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
base64 = "0.22"
rand = "0.8"
url = "2"
keyring = "3"
sha1 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time", "net", "sync"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
md-5 = "0.10"
semver = "1"
dashmap = "6"
tokio-util = "0.7"
regex = "1"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
