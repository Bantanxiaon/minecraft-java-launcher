name: Build and release SHLN
on:
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shln-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/.build-cache/packages
      DOTNET_CLI_HOME: ${{ github.workspace }}/.build-cache/cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and run checks
        run: python tools/dev.py check
      - name: Create Windows portable package
        run: python tools/publish_windows.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_github.py
