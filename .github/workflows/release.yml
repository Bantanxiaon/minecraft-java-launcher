name: 发布 SH启动器

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 写入当前 GitHub 仓库的免费更新地址
        run: node scripts/configure-updater.mjs

      - name: 构建、签名并创建发布
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SH_UPDATES_ENABLED: "true"
        with:
          tagName: v__VERSION__
          releaseName: "SH启动器 v__VERSION__"
          releaseBody: |
            ## SH启动器 v__VERSION__

            - 新增精美启动动画：动画期间并行完成游戏、游戏库、模组与整合包、Java 环境和更新检查，并显示进度条与检查清单。
            - 启动前自动识别缺失的前置模组，并从 Modrinth 自动下载补全。
            - 下载任务显示文件名、大小、速度和预计剩余时间。
            - 首页显示新版本更新卡片，更新完成后自动弹出更新内容。
            - 修复窗口无法拖动的问题。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: false
          args: --bundles nsis
          assetNamePattern: SHLauncher-{version}-setup.{ext}

      - name: 生成并上传 latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SIG_FILE="$(ls src-tauri/target/release/bundle/nsis/*.sig | head -n1)"
          SIGNATURE="$(cat "$SIG_FILE")"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SHLauncher-${VERSION}-setup.exe"
          jq -n --arg version "$VERSION" --arg sig "$SIGNATURE" --arg url "$URL" \
            '{version:$version, notes:"SH启动器 " + $version, pub_date:(now|todateiso8601), platforms:{"windows-x86_64":{signature:$sig, url:$url}}}' \
            > latest.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json"
