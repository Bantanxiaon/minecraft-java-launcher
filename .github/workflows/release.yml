name: 发布 SH启动器

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端质量门禁
        run: |
          pnpm lint
          pnpm test
          pnpm build

      - name: Rust 质量门禁
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Release Gate（零遗留 + 版本 + 基准 + 文档）
        run: node scripts/release-gate.mjs

      - name: 写入当前 GitHub 仓库的免费更新地址
        run: node scripts/configure-updater.mjs

      - name: 构建、签名并创建发布
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SH_UPDATES_ENABLED: "true"
          SH_GIT_COMMIT: ${{ github.sha }}
        with:
          tagName: v__VERSION__
          releaseName: "SH启动器 v__VERSION__"
          releaseBody: "SH启动器 v__VERSION__（详见更新日志）"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: false
          args: --bundles nsis

      - name: 写入正式发布说明
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f "docs/release-notes/${VERSION}.md" ]; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "docs/release-notes/${VERSION}.md"
          fi

      - name: 推送安装包到仓库（jsDelivr CDN 分发）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EXE_FILE="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n1)"
          git config user.name "SH Launcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout -f -b dist-update origin/main
          mkdir -p release-assets
          cp "$EXE_FILE" release-assets/SHLauncher-setup.exe
          SIG_FILE="$(ls src-tauri/target/release/bundle/nsis/*.sig | head -n1)"
          SIGNATURE="$(cat "$SIG_FILE")"
          URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/release-assets/SHLauncher-setup.exe"
          jq -n --arg version "$VERSION" --arg sig "$SIGNATURE" --arg url "$URL" \
            '{version:$version, notes:"SH启动器 " + $version, pub_date:(now|todateiso8601), platforms:{"windows-x86_64":{signature:$sig, url:$url}}}' \
            > release-assets/latest.json
          git add release-assets
          git commit -m "release-assets: update installer to v${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "DIST_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: 生成并上传 latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SIG_FILE="$(ls src-tauri/target/release/bundle/nsis/*.sig | head -n1)"
          SIGNATURE="$(cat "$SIG_FILE")"
          URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${DIST_SHA}/release-assets/SHLauncher-setup.exe"
          jq -n --arg version "$VERSION" --arg sig "$SIGNATURE" --arg url "$URL" \
            '{version:$version, notes:"SH启动器 " + $version, pub_date:(now|todateiso8601), platforms:{"windows-x86_64":{signature:$sig, url:$url}}}' \
            > latest.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json"
