name: 发布 SH启动器

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 写入当前 GitHub 仓库的免费更新地址
        run: node scripts/configure-updater.mjs

      - name: 构建、签名并创建发布
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SH_UPDATES_ENABLED: "true"
        with:
          tagName: v__VERSION__
          releaseName: "SH启动器 v__VERSION__"
          releaseBody: |
            ## SH启动器 v__VERSION__

            - 新增精美启动动画：动画期间并行完成游戏、游戏库、模组与整合包、Java 环境和更新检查，并显示进度条与检查清单。
            - 启动前自动识别缺失的前置模组，并从 Modrinth 自动下载补全。
            - 下载任务显示文件名、大小、速度和预计剩余时间。
            - 首页显示新版本更新卡片，更新完成后自动弹出更新内容。
            - 修复窗口无法拖动的问题。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: false
          args: --bundles nsis

      - name: 推送安装包到仓库（jsDelivr CDN 分发）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXE_FILE="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n1)"
          git config user.name "SH Launcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout -f -b dist-update origin/main
          mkdir -p release-assets
          cp "$EXE_FILE" release-assets/SHLauncher-setup.exe
          cp "$EXE_FILE" release-assets/SHLauncher-setup.zip
          git add release-assets
          git commit -m "release-assets: update installer to v${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "DIST_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: 生成并上传 latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SIG_FILE="$(ls src-tauri/target/release/bundle/nsis/*.sig | head -n1)"
          SIGNATURE="$(cat "$SIG_FILE")"
          # jsDelivr 国内 CDN 稳定分发（提交号固定，避免 CDN 缓存旧包）；签名校验保证内容安全
          URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${DIST_SHA}/release-assets/SHLauncher-setup.zip"
          jq -n --arg version "$VERSION" --arg sig "$SIGNATURE" --arg url "$URL" \
            '{version:$version, notes:"SH启动器 " + $version, pub_date:(now|todateiso8601), platforms:{"windows-x86_64":{signature:$sig, url:$url}}}' \
            > latest.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json"
      - name: 生成并上传 latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
